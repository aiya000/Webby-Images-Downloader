name: fdroid lint

# Lints the F-Droid build metadata kept in `fdroid/metadata/` (the file submitted to fdroiddata)
# with the same `fdroid lint` that fdroiddata's CI runs.

on:
  push:
    branches:
      - main
    paths:
      - fdroid/**
      - fastlane/**
      - .github/workflows/fdroid-lint.yml
  pull_request:
    paths:
      - fdroid/**
      - fastlane/**
      - .github/workflows/fdroid-lint.yml
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install fdroidserver
        run: python -m pip install --upgrade pip fdroidserver

      - name: fdroid lint
        working-directory: fdroid
        run: fdroid lint --verbose io.github.aiya000.webbyimagesdownloader

      - name: Check metadata formatting
        working-directory: fdroid
        run: |
          fdroid rewritemeta io.github.aiya000.webbyimagesdownloader
          git diff --exit-code -- metadata
